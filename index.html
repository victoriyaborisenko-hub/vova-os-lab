
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vova OS Lab</title>
  <style>
    body {
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
    }
    h1 { color: #60a5fa; }
    .systems {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 25px;
      width: 190px;
    }
    .icon { font-size: 48px; }
    a {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 12px 22px;
      border-radius: 8px;
      text-decoration: none;
    }
    a:hover { background: #1d4ed8; }
  </style>
</head>
<body>

  <h1>🖥️ Vova OS Lab</h1>
  <p>Explore real operating systems in your browser!</p>

  <div class="systems">
    <div class="card">
      <div class="icon">🪟</div>
      <h2>Windows 95</h2>
      <p>Classic Windows</p>
      <a href="https://copy.sh/v86/?profile=windows95"
         target="_blank" rel="noopener noreferrer">Launch</a>
    </div>

    <div class="card">
      <div class="icon">🐧</div>
      <h2>Arch Linux</h2>
      <p>Linux terminal</p>
      <a href="https://copy.sh/v86/?profile=archlinux"
         target="_blank" rel="noopener noreferrer">Launch</a>
    </div>

    <div class="card">
      <div class="icon">💻</div>
      <h2>FreeDOS</h2>
      <p>Classic command line</p>
      <a href="https://copy.sh/v86/?profile=freedos"
         target="_blank" rel="noopener noreferrer">Launch</a>
    </div>

    <div class="card">
      <div class="icon">🚀</div>
      <h2>KolibriOS</h2>
      <p>Lightweight graphical OS</p>
      <a href="https://copy.sh/v86/?profile=kolibrios"
         target="_blank" rel="noopener noreferrer">Launch</a>
    </div>
  </div>

  <p style="margin-top: 50px">
    Created by Vova | Powered by v86
  </p>

</body>
</html>
